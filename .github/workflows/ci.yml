name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit + behavioral tests
        run: pytest tests -q

      # THE GATE. If agent accuracy drops, the build fails. This is the whole
      # point of having evals: prompt changes can no longer regress silently.
      - name: Eval gate
        run: pytest evals -q
