[project]
name = "triage-agent"
version = "0.1.0"
description = "A production-style harness for one task: automated incident triage with an LLM agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahek Imtiyaz", email = "maherimtiyaz7@gmail.com" }]
keywords = ["llm", "agents", "ai", "harness", "sre", "incident-response", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
triage = "triage_agent.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/triage-agent"
Repository = "https://github.com/OWNER/triage-agent"
Issues = "https://github.com/OWNER/triage-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/evals",
    "/victim",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"victim/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
